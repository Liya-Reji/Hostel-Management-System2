{% extends "base.html" %}
{% block title %}Internal Server Error - 500{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5 border-0 shadow-sm">
                <div class="text-danger fs-1 mb-3"><i class="bi bi-exclamation-octagon"></i></div>
                <h2 class="fw-bold text-navy mb-2">500 - System Error</h2>
                <p class="text-muted mb-4">An internal error occurred. For security reasons, error details are withheld.</p>
                <div>
                    <a href="{{ url_for('index') }}" class="btn btn-teal">Return to Homepage</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
