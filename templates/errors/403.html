{% extends "base.html" %}
{% block title %}Access Denied - 403{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5 border-0 shadow-sm">
                <div class="text-danger fs-1 mb-3"><i class="bi bi-shield-x"></i></div>
                <h2 class="fw-bold text-navy mb-2">403 - Access Forbidden</h2>
                <p class="text-muted mb-4">You do not have permission to access the requested resource or dashboard.</p>
                <div>
                    <a href="{{ url_for('index') }}" class="btn btn-teal">Return to Safety</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
