{% extends "base.html" %}
{% block title %}Page Not Found - 404{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5 border-0 shadow-sm">
                <div class="text-warning fs-1 mb-3"><i class="bi bi-question-circle"></i></div>
                <h2 class="fw-bold text-navy mb-2">404 - Page Not Found</h2>
                <p class="text-muted mb-4">The page or record you are searching for does not exist or has been relocated.</p>
                <div>
                    <a href="{{ url_for('index') }}" class="btn btn-teal">Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
