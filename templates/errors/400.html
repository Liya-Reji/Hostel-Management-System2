{% extends "base.html" %}
{% block title %}Bad Request - 400{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5 border-0 shadow-sm">
                <div class="text-warning fs-1 mb-3"><i class="bi bi-shield-slash"></i></div>
                <h2 class="fw-bold text-navy mb-2">400 - Bad Request</h2>
                <p class="text-muted mb-4">The submitted request was invalid or failed security validation (e.g. expired CSRF token).</p>
                <div>
                    <a href="{{ url_for('index') }}" class="btn btn-teal">Return to Homepage</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
